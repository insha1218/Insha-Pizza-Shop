<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insha Pizza Shop</title>
<style>
:root{--gold:#FFD700}*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:radial-gradient(circle at top,#2a2a2a,#000);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:15px}
h1{color:var(--gold);text-shadow:0 0 15px var(--gold);text-align:center;font-size:30px}
.wheel-wrap{position:relative;width:340px;height:340px;margin:18px}
#wheel{width:100%;height:100%;border-radius:50%;border:8px solid var(--gold);box-shadow:0 0 30px rgba(255,215,0,.6);transition:transform 4.3s cubic-bezier(.17,.67,.12,.99);object-fit:cover}
#pointer{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:32px solid red;z-index:5;filter:drop-shadow(0 2px 3px #000)}
button{padding:14px 28px;border:none;border-radius:30px;background:linear-gradient(45deg,var(--gold),#FFA000);color:#000;font-weight:900;font-size:18px;cursor:pointer;margin:10px}
.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,215,0,.3);border-radius:16px;padding:18px;width:100%;max-width:380px;text-align:center;margin-top:10px}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #555;background:#111;color:#fff;margin:8px 0}
.info{background:#111;border:1px solid #333;border-radius:12px;padding:15px;width:100%;max-width:380px;margin-top:18px;text-align:center;line-height:1.9}
.info a{color:var(--gold);text-decoration:none;font-weight:bold}
#adminPanel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:99;overflow:auto;padding:20px}
.admin-box{background:#1a1a1a;border:2px solid var(--gold);border-radius:12px;padding:20px;max-width:600px;margin:20px auto}
</style></head><body>
<h1>🍕 INSHA PIZZA SHOP 🍕</h1><p style="color:#ccc">Spin The Wheel & Win Upto 20% OFF</p>
<div class="wheel-wrap"><div id="pointer"></div><img id="wheel" src="wheel.jpg"></div>
<button id="spinBtn" onclick="spin()">🎡 SPIN NOW</button>
<div class="card" id="resultCard" style="display:none">
<h2 id="winText" style="color:var(--gold);font-size:34px"></h2><p id="giftText"></p>
<input id="custName" placeholder="Your Name / آپ کا نام"><input id="custPhone" placeholder="WhatsApp Number">
<button onclick="claim()">✅ Claim on WhatsApp</button></div>
<div class="info"><b>📍 INSHA PIZZA SHOP</b><br>📞 <a href="tel:03427529146">0342-7529146</a> | <a href="tel:03354277240">0335-4277240</a><br>⏰ 11 AM - 2 AM | 🛵 Free Delivery</div>
<span style="color:var(--gold);font-size:12px;text-decoration:underline;margin-top:12px;cursor:pointer" onclick="openAdmin()">Admin Login</span>
<div id="adminPanel"><div class="admin-box"><h2 style="color:var(--gold)">Admin Panel</h2>
<div id="loginBox"><input type="password" id="adminPass" placeholder="Password"><button onclick="checkAdmin()">Login</button><button onclick="closeAdmin()" style="background:#444;color:#fff">Close</button></div>
<div id="dataBox" style="display:none"><h3 id="totalCount"></h3><button onclick="exportCSV()">Export CSV</button><button onclick="clearAll()" style="background:red;color:#fff">Clear All Data</button><button onclick="closeAdmin()" style="background:#444;color:#fff">Close</button><div id="dataList" style="margin-top:15px;font-size:13px"></div></div></div></div>
<script>
// FIXED: Original image has boundary between 20% and 3% at top (0 deg)
// So clockwise from top: 3%,5%,8%,10%,13%,15%,18%,20%
const realOrder = ["3%","5%","8%","10%","13%","15%","18%","20%"];
const weightedBase = [{label:"20%",weight:2,gift:"JACKPOT! 🎉"},{label:"18%",weight:5,gift:"Almost Jackpot!"},{label:"15%",weight:10,gift:"Great!"},{label:"13%",weight:12,gift:"Nice!"},{label:"10%",weight:18,gift:""},{label:"8%",weight:20,gift:""},{label:"5%",weight:25,gift:""},{label:"3%",weight:30,gift:""}];
let currentRotation=0; let spinning=false; let lastWin=null;
function pickWeighted(){let t=0;weightedBase.forEach(o=>t+=o.weight);let r=Math.random()*t;for(let o of weightedBase){if(r<o.weight)return o;r-=o.weight}return weightedBase[weightedBase.length-1]}
function spin(){
 if(spinning)return;
 if(localStorage.getItem('insha_shop_spun')){
   alert("You have already spun! / آپ پہلے ہی Spin کر چکے ہیں! One phone = one spin.");
   return;
 }
 spinning=true; document.getElementById('spinBtn').disabled=true;
 const chosen=pickWeighted(); lastWin=chosen;
 const idx=realOrder.indexOf(chosen.label);
 const slice=360/realOrder.length; //45
 // center of slice idx is at idx*slice + slice/2 from top boundary
 const target = 360 - (idx*slice + slice/2); // bring center to top
 const currentMod = ((currentRotation % 360)+360)%360;
 let diff = (target - currentMod + 360) % 360;
 if(diff<30) diff+=360; // at least one full extra turn visually
 currentRotation = currentRotation + (4*360) + diff;
 document.getElementById('wheel').style.transform=`rotate(${currentRotation}deg)`;
 setTimeout(()=>{
   document.getElementById('resultCard').style.display='block';
   document.getElementById('winText').innerText=chosen.label+' OFF';
   document.getElementById('giftText').innerText=chosen.gift;
   spinning=false;
   window.scrollTo({top:500,behavior:'smooth'});
 },4300);
}
function claim(){let n=document.getElementById('custName').value||'Customer';let p=document.getElementById('custPhone').value;if(p.length<10){alert('Please enter valid WhatsApp number / صحیح نمبر ڈالیں');return}let all=JSON.parse(localStorage.getItem('insha_shop_data')||'[]');all.push({name:n,phone:p,win:lastWin.label,date:new Date().toLocaleString()});localStorage.setItem('insha_shop_data',JSON.stringify(all));localStorage.setItem('insha_shop_spun','1');let msg=`Salam Insha Pizza Shop!%0AName:${n}%0APhone:${p}%0AWon:${lastWin.label}%0AConfirm`;window.open(`https://wa.me/923427529146?text=${msg}`,'_blank');}
function openAdmin(){document.getElementById('adminPanel').style.display='block'}
function closeAdmin(){document.getElementById('adminPanel').style.display='none'}
function checkAdmin(){if(document.getElementById('adminPass').value==='1218'){document.getElementById('loginBox').style.display='none';document.getElementById('dataBox').style.display='block';loadData()}else alert('Wrong Password!')}
function loadData(){let all=JSON.parse(localStorage.getItem('insha_shop_data')||'[]');document.getElementById('totalCount').innerText='Total Spins: '+all.length;let h='<table style=\"width:100%;border-collapse:collapse\"><tr><th>#</th><th>Name</th><th>Phone</th><th>Win</th><th>Date</th></tr>';all.slice().reverse().forEach((r,i)=>{h+=`<tr><td>${all.length-i}</td><td>${r.name}</td><td>${r.phone}</td><td>${r.win}</td><td>${r.date}</td></tr>`});h+='</table>';document.getElementById('dataList').innerHTML=h;}
function exportCSV(){let all=JSON.parse(localStorage.getItem('insha_shop_data')||'[]');let csv='Name,Phone,Win,Date\n';all.forEach(r=>{csv+=`${r.name},${r.phone},${r.win},${r.date}\n`});let b=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Insha-Shop.csv';a.click();}
function clearAll(){if(confirm('Clear all data? / سارا ڈیٹا ڈیلیٹ؟')){localStorage.removeItem('insha_shop_data');localStorage.removeItem('insha_shop_spun');loadData();alert('Cleared! Now you can spin again for testing.');location.reload();}}
// For testing: add ?clear to url to clear
if(window.location.search.includes('clear')){localStorage.removeItem('insha_shop_spun');}
if(window.location.search.includes('admin=1'))openAdmin();
</script></body></html>
