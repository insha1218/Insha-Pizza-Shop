<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insha Pizza - 135 DEG FIX</title>
<style>:root{--gold:#FFD700;--gold2:#FFA000}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',sans-serif;background:#0a0a0a;color:#fff}
header{background:#111;border-bottom:3px solid var(--gold);padding:12px;display:flex;align-items:center}
.logo{display:flex;align-items:center;gap:10px}.logo img{width:50px;height:50px;border-radius:50%;border:3px solid var(--gold);object-fit:cover}
.logo h1{font-size:18px;color:var(--gold)}
.wheel-section{border:2px solid var(--gold);border-radius:20px;margin:15px auto;padding:15px;text-align:center;max-width:400px;background:#111}
.wheel-wrap{position:relative;width:310px;height:310px;margin:10px auto}#wheel{width:100%;height:100%;border-radius:50%;border:7px solid var(--gold);transition:transform 5s cubic-bezier(.17,.67,.12,.99)}
#pointer{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:36px solid red;z-index:10}
#ownerCenter{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:68px;height:68px;border-radius:50%;border:4px solid var(--gold);z-index:12;object-fit:cover}
.card{background:#222;border:1px solid #444;border-radius:10px;padding:12px;margin-top:10px}
input{width:100%;padding:10px;border-radius:8px;border:1px solid #444;background:#000;color:#fff;margin:5px 0}
.btn{padding:12px 26px;border:none;border-radius:30px;background:linear-gradient(45deg,var(--gold),var(--gold2));color:#000;font-weight:900;cursor:pointer}
</style></head><body>
<header><div class="logo"><img src="owner.jpg"><h1>INSHA PIZZA SHOP</h1></div></header>
<div style="text-align:center;padding:15px"><h2 style="color:var(--gold)">🎡 Spin & Win Upto 20% OFF!</h2>
<div class="wheel-section"><div class="wheel-wrap"><div id="pointer"></div><img id="wheel" src="wheel.jpg?v=13_TOP_20_FIX_135DEG"><img id="ownerCenter" src="owner.jpg"></div><button id="spinBtn" onclick="spin()" class="btn">🎡 SPIN NOW</button><div class="card" id="resultCard" style="display:none"><h2 id="winText" style="color:var(--gold);font-size:32px"></h2><p id="giftText"></p><input id="custName" placeholder="Your Name"><input id="custPhone" placeholder="WhatsApp"><button onclick="claim()" class="btn" style="width:100%">✅ Claim</button></div></div></div>
<script>
// === FIXED FOR YOUR CURRENT IMAGE - TOP IS 13% ===
// Your screenshot: Top = 13%, 20% is 3 blocks clockwise (135°)
// Clockwise order from top: 13% (0°), 15% (45°), 18% (90°), 20% (135°), 3% (180°), 5% (225°), 8% (270°), 10% (315°)
// To bring to top: rotation = 360 - original angle

const angleMap = {
  "13%": 0,    // 13% top par - 0 deg
  "15%": 315,  // 15% 45° clockwise, need 315°
  "18%": 270,  // 90° -> 270°
  "20%": 225,  // 20% is 135° clockwise, so 360-135=225° - YAHI AAPKA MASLA THA!
  "3%": 180,
  "5%": 135,
  "8%": 90,
  "10%": 45
};

const weightedBase=[{label:"20%",weight:2,gift:"🎉 JACKPOT 20%!"},{label:"18%",weight:5,gift:"🔥 18%!"},{label:"15%",weight:10,gift:"15%!"},{label:"13%",weight:12,gift:"13%!"},{label:"10%",weight:18,gift:"10% OFF!"},{label:"8%",weight:20,gift:"8% OFF!"},{label:"5%",weight:25,gift:"5% OFF!"},{label:"3%",weight:30,gift:"3% OFF!"}];
let currentRotation=0,spinning=false,lastWin=null;
function pickWeighted(){let t=0;weightedBase.forEach(o=>t+=o.weight);let r=Math.random()*t;for(let o of weightedBase){if(r<o.weight)return o;r-=o.weight}return weightedBase[weightedBase.length-1]}
function spin(){
 if(spinning)return;
 if(localStorage.getItem('insha_shop_spun')){alert("Already spun!");return;}
 spinning=true;document.getElementById('spinBtn').disabled=true;
 const chosen=pickWeighted();lastWin=chosen;
 const baseAngle = angleMap[chosen.label];
 currentRotation=(8*360)+baseAngle;
 document.getElementById('wheel').style.transform=`rotate(${currentRotation}deg)`;
 setTimeout(()=>{
  document.getElementById('resultCard').style.display='block';
  document.getElementById('winText').innerText=chosen.label+' OFF';
  document.getElementById('giftText').innerText=chosen.gift;
  spinning=false;document.getElementById('spinBtn').disabled=false;
 },5200);
}
function claim(){let n=document.getElementById('custName').value||'Customer';let p=document.getElementById('custPhone').value;if(p.length<10){alert('Valid number');return}let all=JSON.parse(localStorage.getItem('insha_shop_data')||'[]');all.push({name:n,phone:p,win:lastWin.label,date:new Date().toLocaleString()});localStorage.setItem('insha_shop_data',JSON.stringify(all));localStorage.setItem('insha_shop_spun','1');window.open(`https://wa.me/923427529146?text=Name:${n} Phone:${p} Won:${lastWin.label}`,'_blank');}
if(window.location.search.includes('clear')){localStorage.removeItem('insha_shop_spun');}
</script></body></html>
