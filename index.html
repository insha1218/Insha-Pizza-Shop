<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insha Pizza Shop - Spin & Win</title>
<style>
:root{--gold:#FFD700;--red:#D32F2F;--dark:#0f0f0f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:radial-gradient(circle at top,#2a2a2a,#000);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{color:var(--gold);text-shadow:0 0 15px var(--gold);margin:10px 0}
.wheel-wrap{position:relative;width:340px;height:340px;margin:20px}
#wheel{width:100%;height:100%;border-radius:50%;border:8px solid var(--gold);box-shadow:0 0 30px rgba(255,215,0,.6);transition:transform 4s cubic-bezier(.17,.67,.12,.99);object-fit:cover}
#pointer{position:absolute;top:-15px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:30px solid var(--red);filter:drop-shadow(0 0 5px #000);z-index:2}
button{padding:14px 28px;border:none;border-radius:30px;background:linear-gradient(45deg,var(--gold),#FFA000);color:#000;font-weight:900;font-size:18px;cursor:pointer;box-shadow:0 5px 20px rgba(255,215,0,.5);margin:10px}
button:active{transform:scale(.95)}
.card{background:rgba(255,255,255,.08);backdrop-filter:blur(10px);border:1px solid rgba(255,215,0,.3);border-radius:16px;padding:20px;width:100%;max-width:380px;text-align:center;margin-top:10px}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #555;background:#111;color:#fff;margin:8px 0}
#adminPanel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:99;overflow:auto;padding:20px}
.admin-box{background:#1a1a1a;border:2px solid var(--gold);border-radius:12px;padding:20px;max-width:600px;margin:20px auto}
table{width:100%;border-collapse:collapse;margin-top:15px;font-size:13px}
th,td{border:1px solid #333;padding:8px;text-align:left} th{background:#222;color:var(--gold)}
.badge{color:var(--gold);font-size:12px;cursor:pointer;text-decoration:underline;margin-top:15px;display:inline-block}
</style>
</head>
<body>
<h1>🍕 INSHA PIZZA SHOP 🍕</h1>
<p style="color:#ccc">Spin The Wheel & Win Upto 20% OFF</p>

<div class="wheel-wrap">
<div id="pointer"></div>
<img id="wheel" src="wheel.jpg" alt="wheel" onerror="this.src='https://i.ibb.co/3mJz0g0/wheel-placeholder.png'">
</div>

<button id="spinBtn" onclick="spin()">🎡 SPIN NOW</button>

<div class="card" id="resultCard" style="display:none">
<h2 id="winText" style="color:var(--gold);font-size:28px"></h2>
<p id="giftText"></p>
<input id="custName" placeholder="آپ کا نام">
<input id="custPhone" placeholder="WhatsApp نمبر 03xx-xxxxxxx">
<button onclick="claim()">✅ Claim on WhatsApp</button>
</div>

<span class="badge" onclick="openAdmin()">Admin Login</span>

<div id="adminPanel">
<div class="admin-box">
<h2 style="color:var(--gold)">🔐 Admin Panel - Insha Pizza Shop</h2>
<div id="loginBox">
<input type="password" id="adminPass" placeholder="Password">
<button onclick="checkAdmin()">Login</button>
<button onclick="closeAdmin()" style="background:#444;color:#fff">Close</button>
</div>
<div id="dataBox" style="display:none">
<h3>Total Spins: <span id="totalCount">0</span></h3>
<button onclick="exportCSV()" style="font-size:14px;padding:8px 16px">📥 Export CSV</button>
<button onclick="clearData()" style="background:#D32F2F;color:#fff;font-size:14px;padding:8px 16px">🗑️ Clear All</button>
<button onclick="closeAdmin()" style="background:#444;color:#fff;font-size:14px;padding:8px 16px">Close</button>
<table><thead><tr><th>#</th><th>Name</th><th>Phone</th><th>Win</th><th>Date</th></tr></thead><tbody id="dataTable"></tbody></table>
</div>
</div>
</div>

<script>
const offersClockwise = ["3%","5%","8%","10%","13%","15%","18%","20%"];
const weightedBase = [{label:"20%",weight:2,gift:"JACKPOT! 🎉"},{label:"18%",weight:5,gift:"Almost Jackpot!"},{label:"15%",weight:10,gift:"Great!"},{label:"13%",weight:12,gift:"Nice!"},{label:"10%",weight:18,gift:""},{label:"8%",weight:20,gift:""},{label:"5%",weight:25,gift:""},{label:"3%",weight:30,gift:""}];
let currentRotation=0; let spinning=false; let lastWin="";

function pickWeighted(){let total=0;weightedBase.forEach(o=>total+=o.weight);let r=Math.random()*total;for(let o of weightedBase){if(r<o.weight)return o;r-=o.weight}return weightedBase[weightedBase.length-1]}
function spin(){
 if(spinning)return; if(localStorage.getItem('insha_shop_spun')){alert('آپ پہلے ہی Spin کر چکے ہیں! ایک موبائل پر ایک ہی بار!');return}
 spinning=true; document.getElementById('spinBtn').disabled=true;
 const chosen=pickWeighted(); lastWin=chosen;
 const idx=offersClockwise.indexOf(chosen.label);
 const sliceAngle=360/offersClockwise.length;
 const targetSliceCenter = (idx*sliceAngle + sliceAngle/2);
 let needed = 270 - targetSliceCenter;
 let randomOffset = (Math.random()* (sliceAngle*0.6) - sliceAngle*0.3);
 currentRotation += 5*360 + needed + randomOffset;
 currentRotation = currentRotation % 360 + 8*360; // keep smooth
 document.getElementById('wheel').style.transform=`rotate(${currentRotation}deg)`;
 setTimeout(()=>{
   document.getElementById('resultCard').style.display='block';
   document.getElementById('winText').innerText=chosen.label + ' OFF';
   document.getElementById('giftText').innerText=chosen.gift;
   spinning=false;
 },4200);
}
function claim(){
 let name=document.getElementById('custName').value||'Customer';
 let phone=document.getElementById('custPhone').value;
 if(phone.length<10){alert('صحیح WhatsApp نمبر ڈالیں');return}
 let all=JSON.parse(localStorage.getItem('insha_shop_data')||'[]');
 all.push({name,phone,win:lastWin.label,date:new Date().toLocaleString()});
 localStorage.setItem('insha_shop_data',JSON.stringify(all));
 localStorage.setItem('insha_shop_spun','1');
 let msg=`Salam Insha Pizza Shop!%0AName: ${name}%0APhone: ${phone}%0AI Won: ${lastWin.label} OFF%0APlease confirm my discount.`;
 window.open(`https://wa.me/923001234567?text=${msg}`,'_blank');
}

// Admin
function openAdmin(){document.getElementById('adminPanel').style.display='block'}
function closeAdmin(){document.getElementById('adminPanel').style.display='none'}
function checkAdmin(){if(document.getElementById('adminPass').value==='1218'){document.getElementById('loginBox').style.display='none';document.getElementById('dataBox').style.display='block';loadData()}else alert('Wrong Password!')}
function loadData(){
 let all=JSON.parse(localStorage.getItem('insha_shop_data')||'[]');
 document.getElementById('totalCount').innerText=all.length;
 let html=''; all.reverse().forEach((r,i)=>{html+=`<tr><td>${all.length-i}</td><td>${r.name}</td><td>${r.phone}</td><td>${r.win}</td><td>${r.date}</td></tr>`});
 document.getElementById('dataTable').innerHTML=html;
}
function exportCSV(){
 let all=JSON.parse(localStorage.getItem('insha_shop_data')||'[]');
 let csv='Name,Phone,Win,Date\n'; all.forEach(r=>{csv+=`${r.name},${r.phone},${r.win},${r.date}\n`});
 let blob=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Insha-Pizza-Shop-Customers.csv'; a.click();
}
function clearData(){if(confirm('سارا ڈیٹا ڈیلیٹ کر دوں؟')){localStorage.removeItem('insha_shop_data');localStorage.removeItem('insha_shop_spun');loadData();alert('Cleared!')}}

// Auto open if ?admin=1
if(window.location.search.includes('admin=1'))openAdmin();
</script>
</body>
</html>
