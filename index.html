<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insha Pizza Shop</title>
<style>
:root{--gold:#FFD700}*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:radial-gradient(circle at top,#2a2a2a,#000);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:15px}
h1{color:var(--gold);text-shadow:0 0 15px var(--gold);text-align:center;font-size:28px}
.wheel-wrap{position:relative;width:350px;height:350px;margin:18px}
#wheel{width:100%;height:100%;border-radius:50%;border:8px solid var(--gold);box-shadow:0 0 35px rgba(255,215,0,.7);transition:transform 4.8s cubic-bezier(.17,.67,.12,.99)}
#pointer{position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:40px solid red;z-index:10}
button{padding:13px 24px;border:none;border-radius:30px;background:linear-gradient(45deg,var(--gold),#FFA000);color:#000;font-weight:900;font-size:17px;cursor:pointer;margin:6px}
.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,215,0,.4);border-radius:16px;padding:18px;width:100%;max-width:380px;text-align:center;margin-top:10px}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #555;background:#111;color:#fff;margin:8px 0}
.info{background:#111;border:1px solid #333;border-radius:12px;padding:15px;width:100%;max-width:380px;margin-top:18px;text-align:center;line-height:1.9}
.info a{color:var(--gold);text-decoration:none;font-weight:bold}
#adminPanel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:99;overflow:auto;padding:20px}
.admin-box{background:#1a1a1a;border:2px solid var(--gold);border-radius:12px;padding:20px;max-width:600px;margin:20px auto}
</style></head><body>
<h1>🍕 INSHA PIZZA SHOP 🍕</h1><p style="color:#ccc">Spin The Wheel & Win Upto 20% OFF</p>
<div class="wheel-wrap"><div id="pointer"></div><img id="wheel" src="wheel.jpg?v=final8"></div>
<button id="spinBtn" onclick="spin()">🎡 SPIN NOW</button>
<div class="card" id="resultCard" style="display:none">
<h2 id="winText" style="color:var(--gold);font-size:38px;text-shadow:0 0 12px var(--gold)"></h2>
<p id="giftText" style="font-size:18px"></p>
<input id="custName" placeholder="Your Name / آپ کا نام"><input id="custPhone" placeholder="WhatsApp Number">
<button onclick="claim()">✅ Claim on WhatsApp</button>
</div>
<div class="info"><b>📍 INSHA PIZZA SHOP</b><br>📞 <a href="tel:03427529146">0342-7529146</a> | <a href="tel:03354277240">0335-4277240</a><br>⏰ 11 AM - 2 AM | 🛵 Free Delivery</div>
<span style="color:var(--gold);font-size:12px;text-decoration:underline;margin-top:12px;cursor:pointer" onclick="openAdmin()">Admin Login</span>

<div id="adminPanel"><div class="admin-box">
<h2 style="color:var(--gold)">Admin Panel</h2>
<div id="loginBox"><input type="password" id="adminPass" placeholder="Password 1218"><button onclick="checkAdmin()">Login</button><button onclick="closeAdmin()" style="background:#444;color:#fff">Close</button></div>
<div id="dataBox" style="display:none">
<h3 id="totalCount"></h3>
<button onclick="exportCSV()">📥 Export</button>
<button onclick="clearAll()" style="background:#D32F2F;color:#fff">Clear</button>
<button onclick="closeAdmin()" style="background:#444;color:#fff">Close</button>
<div id="dataList" style="margin-top:15px"></div>
</div></div></div>

<script>
// FINAL FIX: Your old wheel.jpg top line is between 8% and 10%
// Clockwise from top (right side): 10%,13%,15%,18%,20%,3%,5%,8%
const realOrder = ["10%","13%","15%","18%","20%","3%","5%","8%"];
const weightedBase = [{label:"20%",weight:2,gift:"🎉 JACKPOT 20%!"},{label:"18%",weight:5,gift:"🔥 18%!"},{label:"15%",weight:10,gift:"Great 15%!"},{label:"13%",weight:12,gift:"Nice 13%!"},{label:"10%",weight:18,gift:"10% OFF!"},{label:"8%",weight:20,gift:"8% OFF!"},{label:"5%",weight:25,gift:"5% OFF!"},{label:"3%",weight:30,gift:"3% OFF!"}];
let currentRotation=0; let spinning=false; let lastWin=null;

function pickWeighted(){let t=0;weightedBase.forEach(o=>t+=o.weight);let r=Math.random()*t;for(let o of weightedBase){if(r<o.weight)return o;r-=o.weight}return weightedBase[weightedBase.length-1]}

function spin(){
 if(spinning)return;
 if(localStorage.getItem('insha_shop_spun')){alert("You have already spun! / آپ پہلے ہی Spin کر چکے ہیں!");return;}
 spinning=true; document.getElementById('spinBtn').disabled=true; document.getElementById('spinBtn').innerText="Spinning...";
 const chosen=pickWeighted(); lastWin=chosen;
 const idx=realOrder.indexOf(chosen.label);
 const slice=45;
 // Center of winning slice
 const target = 360 - (idx*slice + slice/2);
 // NO accumulation, direct to target + many spins - guarantees arrow in MIDDLE of slice
 currentRotation = (6*360) + target;
 document.getElementById('wheel').style.transform=`rotate(${currentRotation}deg)`;
 setTimeout(()=>{document.getElementById('resultCard').style.display='block';document.getElementById('winText').innerText=chosen.label+' OFF';document.getElementById('giftText').innerText=chosen.gift;spinning=false;document.getElementById('spinBtn').disabled=false;document.getElementById('spinBtn').innerText="🎡 SPIN NOW";},4900);
}
function claim(){let n=document.getElementById('custName').value||'Customer';let p=document.getElementById('custPhone').value;if(p.length<10){alert('Valid number');return}let all=JSON.parse(localStorage.getItem('insha_shop_data')||'[]');all.push({name:n,phone:p,win:lastWin.label,date:new Date().toLocaleString()});localStorage.setItem('insha_shop_data',JSON.stringify(all));localStorage.setItem('insha_shop_spun','1');let msg=`Salam Insha Pizza Shop!%0AName:${n}%0APhone:${p}%0AWon:${lastWin.label}`;window.open(`https://wa.me/923427529146?text=${msg}`,'_blank');}
function openAdmin(){document.getElementById('adminPanel').style.display='block'}function closeAdmin(){document.getElementById('adminPanel').style.display='none'}function checkAdmin(){if(document.getElementById('adminPass').value==='1218'){document.getElementById('loginBox').style.display='none';document.getElementById('dataBox').style.display='block';loadData()}else alert('Wrong!')}function loadData(){let all=JSON.parse(localStorage.getItem('insha_shop_data')||'[]');document.getElementById('totalCount').innerText='Total: '+all.length;let h='<table style=\"width:100%;border-collapse:collapse\"><tr><th>#</th><th>Name</th><th>Phone</th><th>Win</th></tr>';all.slice().reverse().forEach((r,i)=>{h+=`<tr><td>${all.length-i}</td><td>${r.name}</td><td>${r.phone}</td><td>${r.win}</td></tr>`});h+='</table>';document.getElementById('dataList').innerHTML=h;}function exportCSV(){let all=JSON.parse(localStorage.getItem('insha_shop_data')||'[]');let csv='Name,Phone,Win,Date\n';all.forEach(r=>{csv+=`${r.name},${r.phone},${r.win},${r.date}\n`});let b=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Customers.csv';a.click();}function clearAll(){if(confirm('Clear?')){localStorage.removeItem('insha_shop_data');localStorage.removeItem('insha_shop_spun');location.reload();}}if(window.location.search.includes('clear')){localStorage.removeItem('insha_shop_spun');}if(window.location.search.includes('admin=1'))openAdmin();
</script></body></html>
